# HISTORICAL. ODC 2026 preliminary, 2026-09-05, under the 2026/05/20 rules;
# kept to reproduce that submission, never for the ranking round or the duel.
#
# The organizer's script declares no ImpulsiveBurn and no Maneuver, so nothing
# in it says which spacecraft the contestant flies. The rules do: 太空船 A
# (SC_Alien) is gravity-only, 太空船 H (SC_Human) is the one that maneuvers.
pursuer_name: SC_Human
target_name: SC_Alien

search:
  seed: 20260818
  one_burn_samples: 1024
  one_burn_grid_burns: 45
  one_burn_grid_arrivals: 93
  max_revolutions: 3
  min_tof_s: 100.0
  dense_window_fraction: 0.85
  workers: 0
  keep_candidates: 800
  render_top: 25
  endpoint_tolerance_km: 0.01
  event_refine_top: 40
  event_step_s: 1.0
  two_burn_enabled: true
  two_burn_samples: 4096

policy:
  mu_km3_s2: 398600.4418
  intercept_radius_km: 5.0
  dv_limit_km_s: 1.5
  dv_safe_limit_km_s: 1.495
  min_burn_separation_s: 100.0
  safe_burn_separation_s: 101.0
  final_padding_s: 20.0
  allow_zero_vector_unused_slots: true
  require_synchronized_propagation: true

# Announced on the day (photo of the 2026/08/29 初賽版 rules, §6 eq. 3).
# The sheet prints the four numbers and does NOT print the input units for
# t_team or ΔV_team. `s` is settled: Ct = 6505.65 with 4TA = 23816 s puts the
# logistic midpoint inside the mission window, and any coarser unit pushes it
# past the horizon so the term would be a constant 25 for every team.
#
# delta_v_unit is NOT settled and this file picks km/s because that is the unit
# the organizer's own reference Burn Table prints. It does not change the
# ranking either way: the reference solution spends 2.24 km/s, so under km/s the
# term sits at 24.99 for every legal candidate (0.1 point across a 1.5-4.5 km/s
# spread) and under m/s it is 0 for every one of them. Confirm against
# `rank`'s term-spread warning rather than trusting this line.
score:
  kt: 0.003982
  ct: 6505.65
  kv: 1.1862
  cv: 9.0643
  time_unit: s
  delta_v_unit: km/s

gmat:
  verify_top: 0
  timeout_s: 600.0
  reruns: 3
  workers: 4
  diagnostic_report_name: orbitwin_diagnostic.txt
  compare_report_bytes: true
