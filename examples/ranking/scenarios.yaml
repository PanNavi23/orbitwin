# What scripts/measure_ranking_scenario.py printed for each script on GMAT
# R2026a (build Mar 30 2026), 2026-11-01. horizon_s is T_max: the first time
# after perigee that SC_Alien's geocentric distance reaches
# mission_boundary_km. Each script's Propagate goal is its horizon_s.
# perigee_* are GMAT's; v_inf_km_s and plane_angle_deg are the osculating
# values at epoch (plane angle between the two craft's angular momenta).
# human_final_position_km is SC_Human's EarthMJ2000Eq position on the last
# report row of the zero-burn run, which pins the force model GMAT flew.
scenarios:
  - script: R1_NearPlane_Reachable.script
    mission_boundary_km: 17000
    horizon_s: 6711.667
    perigee_time_s: 4500.238
    perigee_altitude_km: 448.995
    v_inf_km_s: 2.0
    plane_angle_deg: 5.0
    zero_burn_closest_km: 604.310
    human_final_position_km: [3959.0803, 5504.4247, -521.7840]
