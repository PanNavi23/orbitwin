scenarios:
  - script: R6_InsertedLate_Aligned.script
    from: R1_NearPlane_Reachable.script
    early: SC_Alien
    lead_s: 1800
    horizon_s: 8511.667
    policy:
      mission_time_origin: earliest
      closest_approach_window: after_alignment
      # Its source's boundary, read by the T_max check and the time-origin evidence.
      mission_boundary_km: 17000
  # The ranking profiles set add_epoch_alignment too since the 2026-11-03 sign-off.
  - script: R7_NoAlignment_NearMiss.script
    from: R2_SteepPlane_NearMiss.script
    early: SC_Alien
    lead_s: 1800
    horizon_s: 7591.381
    policy:
      mission_time_origin: earliest
      closest_approach_window: after_alignment
