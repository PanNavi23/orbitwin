# Asynchronous-start rehearsals, built by scripts/build_async_rehearsals.py on
# GMAT R2026a from R1 and R2: one craft's epoch moved 1800 s earlier, its state
# where GMAT's section 7 model flies it back to in that time. At the later
# epoch, 02:00:00 UTC, the geometry is R1's or R2's: GMAT's alignment returns
# the early craft there to within 5e-9 km. R9 also moves SC_Alien 1800 s later
# (late_moved_s), so at its 02:30:00 the geometry is R1's flown on 1800 s.
#
# horizon_s is T_max from the earlier craft's epoch, as the organizer answered
# Team 54 in writing on 2026-11-04 18:17 (「從比較早開始的開始算」): the source's
# T_max plus the 1800 s the earlier epoch moved, whichever craft has it. SC_Alien reaches
# the boundary at the same instant as in the source, which is 1800 s later
# from the earlier epoch. R8 took SC_Alien's epoch, 6711.667 s, until then.
# `orbitwin inspect` checks T_max against the template's goal and the boundary
# each row carries (docs/ASYNC_START_AND_INSERTION.md).
#
# GMAT's data files the build read. R6's EarthFixed insertion and R8's flight
# back depend on Earth's orientation, so a new EOP file moves them off R1's
# geometry (by 3.8 m for R6 with UT1-UTC 10 ms off): rebuild with
# scripts/build_async_rehearsals.py after refreshing them.
